precedence = "aggregate"
SPDX-FileCopyrightText = "2026 DoCoNEXT"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = ["REUSE.toml", "package.json", "package-lock.json", "tsconfig.json", ".gitignore", ".nvmrc"]
precedence = "aggregate"
SPDX-FileCopyrightText = "none"
SPDX-License-Identifier = "CC0-1.0"
