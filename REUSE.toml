version = 1
SPDX-PackageName = "doconext-nc-ui"
SPDX-PackageSupplier = "DoCoNEXT <support@doconext.com>"
SPDX-PackageDownloadLocation = "https://github.com/DoCoNEXT/doconext-nc-ui"

[[annotations]]
