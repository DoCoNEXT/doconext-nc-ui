name: Bug report
description: A component, composable or style does not work or look as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report this. Please do not paste code
        or a patch.
        [CONTRIBUTING.md](https://github.com/DoCoNEXT/doconext-nc-ui/blob/main/CONTRIBUTING.md#why-no-code)
        explains why an issue with a proposed implementation has to be closed.

        Security problems do not belong here. Use *Report a vulnerability*
        under the Security tab instead.

  - type: textarea
    id: steps
    attributes:
      label: What did you do?
      description: The steps that lead to the problem, as precisely as you can.
      placeholder: |
        1. Open …
        2. …
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: A screenshot helps. Remove names and other data first.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: nc-ui version
      description: The tag in the app's package.json, after `#`.
      placeholder: e.g. v0.1.0
    validations:
      required: true

  - type: input
    id: app
    attributes:
      label: App and version
      placeholder: e.g. DoCoNEXT Finder 0.11.0
    validations:
      required: true

  - type: input
    id: nextcloud-version
    attributes:
      label: Nextcloud version
      placeholder: e.g. 34.0.2
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: e.g. Firefox 146
    validations:
      required: true

  # Most of this package is colour and layout, which differ per theme.
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      options:
        - Light
        - Dark
        - High contrast
        - Several, or I don't know
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: Before you submit
      options:
        - label: This report contains no code or patch.
          required: true
        - label: This is not a security vulnerability.
          required: true
