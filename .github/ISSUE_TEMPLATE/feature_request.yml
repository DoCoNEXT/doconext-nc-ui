name: Feature request
description: Something the shared components should be able to do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the need rather than the solution: what an app should be able
        to show, and why the current components are not enough. We can act on
        a request that explains its reasoning.

  - type: textarea
    id: need
    attributes:
      label: What should an app be able to show or do?
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How is it done today?
      description: With the current components, with plain Nextcloud components, or not at all.
    validations:
      required: true

  - type: textarea
    id: gap
    attributes:
      label: What makes the current behaviour insufficient?
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: Before you submit
      options:
        - label: This request contains no code or patch.
          required: true
